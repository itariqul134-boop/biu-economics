<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIU Economics - Admin Login</title>

<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
}

.login-box{
  max-width:400px;
  margin:100px auto;
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.15);
}

h2{
  text-align:center;
  color:#123;
}

input,textarea{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-size:16px;
}

.dashboard{
  display:none;
  max-width:800px;
  margin:30px auto;
  background:white;
  padding:25px;
  border-radius:15px;
}

.section{
  margin-top:20px;
  padding:20px;
  border:1px solid #ddd;
  border-radius:10px;
}

.logout{
  background:#dc2626;
}

.message{
  text-align:center;
  margin-top:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-box">

<h2>🔐 Admin Login</h2>

<input
  type="email"
  id="email"
  placeholder="Gmail / Email"
  autocomplete="username"
>

<input
  type="password"
  id="password"
  placeholder="Password"
  autocomplete="current-password"
>

<button id="loginBtn">Login</button>

<div id="loginMessage" class="message"></div>

</div>


<!-- ADMIN DASHBOARD -->
<div id="dashboard" class="dashboard">

<h2>🎓 BIU Economics Admin Dashboard</h2>

<div class="section">

<h3>📢 Notice Management</h3>

<textarea
  id="noticeText"
  placeholder="নতুন Notice লিখুন"
  rows="4"
></textarea>

<button id="addNoticeBtn">Notice যোগ করুন</button>

</div>


<div class="section">

<h3>📊 Result Management</h3>

<input id="resultRoll" placeholder="Roll Number">

<input id="resultName" placeholder="Student Name">

<input id="resultStudentId" placeholder="Student ID">

<input id="resultSemester" placeholder="Semester">

<input id="resultGpa" placeholder="GPA">

<button id="addResultBtn">Result যোগ করুন</button>

</div>


<button id="logoutBtn" class="logout">Logout</button>

</div>
