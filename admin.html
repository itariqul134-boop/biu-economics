<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIU Economics Admin</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f1f5f9;
margin:0;
padding:20px;
}
.box{
max-width:500px;
margin:30px auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 2px 10px #ccc;
}
h1,h2{text-align:center}
input,textarea,button{
width:100%;
padding:12px;
margin:7px 0;
box-sizing:border-box;
font-size:16px;
}
button{
background:#2563eb;
color:white;
border:0;
border-radius:6px;
}
#message{
padding:10px;
margin-top:10px;
background:#eef2ff;
border-radius:6px;
}
</style>
</head>

<body>

<div class="box">

<h1>🎓 BIU Economics</h1>
<h2>🔐 Admin Login</h2>

<input id="email" type="email" placeholder="Admin Email">

<input id="password" type="password" placeholder="Password">

<button id="loginBtn">Login</button>

<div id="message">Firebase চালু হচ্ছে...</div>

</div>

<script>
const db = firebase.database();

document.getElementById("addNoticeBtn").onclick = async function(){
const text = document.getElementById("noticeText").value.trim();
if(!text){alert("Notice লিখুন");return;}
try{
await db.ref("notices").push(text);
alert("✅ Notice যোগ হয়েছে");
document.getElementById("noticeText").value="";
}catch(error){
alert("❌ Notice যোগ হয়নি: "+error.message);
}
};

document.getElementById("addResultBtn").onclick = async function(){
const roll = document.getElementById("resultRoll").value.trim();
const name = document.getElementById("resultName").value.trim();
const studentId = document.getElementById("resultStudentId").value.trim();
const semester = document.getElementById("resultSemester").value.trim();
const gpa = document.getElementById("resultGpa").value.trim();

if(!roll || !name || !studentId || !semester || !gpa){
alert("সব তথ্য পূরণ করুন");return;
}

try{
await db.ref("results/"+roll).set({
name:name,
roll:roll,
studentId:studentId,
semester:semester,
gpa:gpa
});
alert("✅ Result যোগ হয়েছে");
document.getElementById("resultRoll").value="";
document.getElementById("resultName").value="";
document.getElementById("resultStudentId").value="";
document.getElementById("resultSemester").value="";
document.getElementById("resultGpa").value="";
}catch(error){
alert("❌ Result যোগ হয়নি: "+error.message);
}
};
</script>
</body>
</html>

<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB8C4mYZp3jhz1QWl6FG55D3bY9TD1OSCM",
  authDomain: "biu-economics-e5503.firebaseapp.com",
  projectId: "biu-economics-e5503",
  storageBucket: "biu-economics-e5503.firebasestorage.app",
  messagingSenderId: "600075103328",
  appId: "1:600075103328:web:78f59b9f3f2bd847f26705",
  measurementId: "G-M6S37HHPYQ"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const message = document.getElementById("message");
const loginBtn = document.getElementById("loginBtn");

loginBtn.onclick = async function(){

  message.textContent = "🔄 Login হচ্ছে...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || !password){
    message.textContent = "❌ Email এবং Password দিন।";
    return;
  }

  try{

    await auth.signInWithEmailAndPassword(email,password);

    message.textContent = "✅ Login সফল হয়েছে!";

  }catch(error){

    message.textContent = "❌ Login failed: " + error.message;

  }

};

auth.onAuthStateChanged(function(user){

  if(user){
    message.textContent = "✅ Admin হিসেবে Login করা আছে: " + user.email;
  }

});
</script>

<script>

  projectId: "biu-economics-e5503",
  storageBucket: "biu-economics-e5503.firebasestorage.app",

};

const loginBtn = document.getElementById("loginBtn");

try {
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  message.textContent = "🟢 Firebase প্রস্তুত। Login করুন।";

  loginBtn.onclick = async function() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      message.textContent = "❌ Email এবং Password দিন।";
      return;
    }

    message.textContent = "🔄 Login হচ্ছে...";

    try {
      await auth.signInWithEmailAndPassword(email, password);
      message.textContent = "✅ Login সফল!";
      document.getElementById("dashboard").style.display = "block"; document.querySelector(".box").style.display = "none";
} catch (error) {
  message.textContent = "❌ Firebase error: " + error.message;
}
</script>
<div id="dashboard" style="display:block;max-width:700px;margin:20px auto;padding:20px;background:white;border-radius:12px;">

<h2>🎓 Admin Dashboard</h2>

<h3>📢 Notice Management</h3>

<textarea id="noticeText" placeholder="নতুন Notice লিখুন" style="width:100%;height:100px;"></textarea>

<button id="addNoticeBtn">Notice যোগ করুন</button>

<div id="noticeList"></div>

<hr>

<h3>📊 Result Management</h3>

<input id="resultRoll" placeholder="Roll Number">
<input id="resultName" placeholder="Student Name">
<input id="resultStudentId" placeholder="Student ID">
<input id="resultSemester" placeholder="Semester">
<input id="resultGpa" placeholder="GPA">

<button id="addResultBtn">Result যোগ করুন</button>

<div id="resultList"></div>

<hr>

<button id="logoutBtn" style="background:#dc2626;color:white;">
Logout
</button>

</div>

<script>
document.getElementById("resultRoll").value="";
document.getElementById("resultName").value="";
document.getElementById("resultStudentId").value="";
document.getElementById("resultSemester").value="";
document.getElementById("resultGpa").value="";
}catch(error){
alert("❌ Result যোগ হয়নি: "+error.message);
}
};
</script>
</body>
</html>
