<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIU Economics Admin</title>

<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
}

.login-box{
width:90%;
max-width:400px;
margin:100px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.15);
}

h2{text-align:center}

input,textarea{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:0;
border-radius:8px;
background:#2563eb;
color:white;
font-size:16px;
}

.dashboard{
display:none;
width:92%;
max-width:800px;
margin:30px auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.section{
margin-top:25px;
padding:20px;
border:1px solid #ddd;
border-radius:12px;
}

.logout{background:#dc2626}

.message{
text-align:center;
margin-top:12px;
font-weight:bold;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-box">

<h2>🔐 Admin Login</h2>

<input
id="email"
type="email"
placeholder="Gmail / Email"
>

<input
id="password"
type="password"
placeholder="Password"
>

<button id="loginBtn">Login</button>

<div id="loginMessage" class="message"></div>

</div>


<!-- DASHBOARD -->
<div id="dashboard" class="dashboard">

<h2>🎓 BIU Economics Admin Dashboard</h2>


<!-- NOTICE -->
<div class="section">

<h3>📢 Notice Management</h3>

<textarea
id="noticeText"
rows="5"
placeholder="নতুন Notice লিখুন"
></textarea>

<button id="addNoticeBtn">
Notice যোগ করুন
</button>

<div id="noticeList" style="margin-top:15px;"></div>

</div>


<!-- RESULT -->
<div class="section">

<h3>📊 Result Management</h3>

<input
id="resultRoll"
placeholder="Roll Number"
>

<input
id="resultName"
placeholder="Student Name"
>

<input
id="resultStudentId"
placeholder="Student ID"
>

<input
id="resultSemester"
placeholder="Semester"
>

<input
id="resultGpa"
placeholder="GPA"
>

<button id="addResultBtn">
Result যোগ করুন
</button>

</div>


<button id="logoutBtn" class="logout">
🚪 Logout
</button>

</div>


<script>

/* FIREBASE */

const firebaseConfig = {

apiKey:"AIzaSyB8C4mYZp3jhz1QWl6FG55D3bY9TD1OSCM",

authDomain:"biu-economics-e5503.firebaseapp.com",

databaseURL:"https://biu-economics-e5503-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:"biu-economics-e5503",

storageBucket:"biu-economics-e5503.firebasestorage.app",

messagingSenderId:"600075103328",

appId:"1:600075103328:web:78f59b9f3f2bd847f26705",

measurementId:"G-M6S37HHPYQY"

};


firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();

const db=firebase.database();


/* LOGIN */

document.getElementById("loginBtn").onclick=async function(){

const email=document.getElementById("email").value.trim();

const password=document.getElementById("password").value;

const message=document.getElementById("loginMessage");

if(!email || !password){

message.textContent="❌ Email এবং Password দিন";

return;

}

message.textContent="⏳ Login হচ্ছে...";

try{

await auth.signInWithEmailAndPassword(email,password);

message.textContent="";

}catch(error){

message.textContent="❌ Login ব্যর্থ: "+error.message;

}

};


/* AUTH STATE */

auth.onAuthStateChanged(function(user){

if(user){

document.getElementById("loginScreen").style.display="none";

document.getElementById("dashboard").style.display="block";

}else{

document.getElementById("loginScreen").style.display="block";

document.getElementById("dashboard").style.display="none";

}

});


/* ADD NOTICE */

document.getElementById("addNoticeBtn").onclick=async function(){

const notice=document.getElementById("noticeText").value.trim();

if(!notice){

alert("❌ Notice লিখুন");

return;

}

if(!auth.currentUser){

alert("❌ আগে Login করুন");

return;

}

try{

const id="notice_"+Date.now();

await db.ref("notices/"+id).set(notice);

alert("✅ Notice সফলভাবে যোগ হয়েছে");

document.getElementById("noticeText").value="";

}catch(error){

alert("❌ Notice যোগ হয়নি: "+error.message);

}

};



/* NOTICE LIST + DELETE */

async function loadNotices(){
    const list = document.getElementById("noticeList");

    if(!list) return;

    try{
        const snap = await db.ref("notices").once("value");
        const data = snap.val() || {};

        list.innerHTML = "";

        Object.entries(data).forEach(([id, notice]) => {

            const box = document.createElement("div");

            box.style.cssText =
                "background:white;padding:12px;margin-top:10px;" +
                "border-radius:8px;border:1px solid #ddd;";

            const text = document.createElement("div");
            text.textContent = notice;

            const del = document.createElement("button");
            del.textContent = "🗑️ Delete";
            del.style.cssText =
                "margin-top:8px;background:#dc2626;color:white;" +
                "border:0;padding:8px 12px;border-radius:6px;";

            del.onclick = async function(){

                if(!auth.currentUser){
                    alert("❌ আগে Login করুন");
                    return;
                }

                if(!confirm("এই Notice কি Delete করবেন?")){
                    return;
                }

                try{
                    await db.ref("notices/" + id).remove();
                    alert("✅ Notice Delete হয়েছে");
                    loadNotices();
                }catch(error){
                    alert("❌ Delete হয়নি: " + error.message);
                }
            };

            box.appendChild(text);
            box.appendChild(del);
            list.appendChild(box);
        });

    }catch(error){
        console.log("Notice load error:", error);
    }
}

loadNotices();


/* ADD RESULT */

document.getElementById("addResultBtn").onclick=async function(){

const roll=document.getElementById("resultRoll").value.trim();

const name=document.getElementById("resultName").value.trim();

const studentId=document.getElementById("resultStudentId").value.trim();

const semester=document.getElementById("resultSemester").value.trim();

const gpa=document.getElementById("resultGpa").value.trim();


if(!roll || !name || !studentId || !semester || !gpa){

alert("❌ সব তথ্য পূরণ করুন");

return;

}

if(!auth.currentUser){

alert("❌ আগে Login করুন");

return;

}


try{

await db.ref("results/"+roll).set({

name:name,

roll:roll,

studentId:studentId,

semester:semester,

gpa:gpa

});

alert("✅ Result সফলভাবে যোগ হয়েছে");

document.getElementById("resultRoll").value="";

document.getElementById("resultName").value="";

document.getElementById("resultStudentId").value="";

document.getElementById("resultSemester").value="";

document.getElementById("resultGpa").value="";


}catch(error){

alert("❌ Result যোগ হয়নি: "+error.message);

}

};


/* LOGOUT */

document.getElementById("logoutBtn").onclick=async function(){

await auth.signOut();

};

</script>

</body>
</html>
