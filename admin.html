<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIU Economics - Admin Panel</title>

<style>
body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#222}
header{background:#123b66;color:white;padding:20px;text-align:center}
.container{max-width:900px;margin:20px auto;padding:15px}
.card{background:white;padding:20px;margin-bottom:20px;border-radius:12px;box-shadow:0 2px 10px #ccc}
input,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border-radius:7px;border:1px solid #ccc}
button{background:#123b66;color:white;border:0;cursor:pointer;font-weight:bold}
button:hover{opacity:.9}
.logout{background:#b42318}
.result{border:1px solid #ddd;padding:15px;margin-top:10px;border-radius:8px}
.hidden{display:none}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ddd;padding:8px;text-align:left}
th{background:#eef3f8}
.message{padding:10px;margin:8px 0}
</style>

<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-database-compat.js"></script>
</head>

<body>

<header>
<h1>🎓 BIU Economics</h1>
<p>Administrator Panel</p>
</header>

<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">
<h2>🔐 Admin Login</h2>

<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">

<button id="loginBtn">Login</button>

<p id="message" class="message"></p>
</div>


<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden">

<div class="card">
<h2>📢 Notice Management</h2>

<textarea id="noticeText" rows="4"
placeholder="নতুন Notice লিখুন"></textarea>

<button id="addNoticeBtn">➕ Notice যোগ করুন</button>

<div id="noticeMessage" class="message"></div>

<h3>বর্তমান Notice</h3>
<div id="noticeList">Loading...</div>
</div>


<div class="card">
<h2>🎓 Result Management</h2>

<input id="resultRoll" placeholder="Roll Number">
<input id="resultName" placeholder="Student Name">
<input id="resultStudentId" placeholder="Student ID">
<input id="resultSemester" placeholder="Semester">
<input id="resultGpa" type="number" step="0.01" placeholder="GPA">

<button id="addResultBtn">➕ Result সংরক্ষণ করুন</button>

<div id="resultMessage" class="message"></div>

<h3>বর্তমান Results</h3>
<div id="resultList">Loading...</div>
</div>


<button id="logoutBtn" class="logout">🚪 Logout</button>

</div>
</div>


<script>

const firebaseConfig = {
  apiKey: "AIzaSyB8C4mYZp3jhz1QWl6FG55D3bY9TD1OSCM",
  authDomain: "biu-economics-e5503.firebaseapp.com",
  projectId: "biu-economics-e5503",
  storageBucket: "biu-economics-e5503.firebasestorage.app",
  messagingSenderId: "600075103328",
  appId: "1:600075103328:web:78f59b9f3f2bd847f26705",
  measurementId: "G-M6S37HHPYQ"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.database(
"https://biu-economics-e5503-default-rtdb.asia-southeast1.firebasedatabase.app"
);

const loginBox = document.getElementById("loginBox");
const adminPanel = document.getElementById("adminPanel");

const email = document.getElementById("email");
const password = document.getElementById("password");
const message = document.getElementById("message");


/* LOGIN */

document.getElementById("loginBtn").onclick = async function(){

const e = email.value.trim();
const p = password.value;

if(!e || !p){
message.textContent="❌ Email এবং Password দিন।";
return;
}

message.textContent="⏳ Login হচ্ছে...";

try{

await auth.signInWithEmailAndPassword(e,p);

message.textContent="✅ Login successful.";

}catch(error){

message.textContent="❌ Login failed: "+(error?.message || error);

}

};


/* AUTH STATE */

auth.onAuthStateChanged(function(user){

if(user){

loginBox.classList.add("hidden");
adminPanel.classList.remove("hidden");

loadNotices();
loadResults();

}else{

loginBox.classList.remove("hidden");
adminPanel.classList.add("hidden");

}

});


/* NOTICE ADD */

document.getElementById("addNoticeBtn").onclick=async function(){

const text=document.getElementById("noticeText").value.trim();

if(!text){

document.getElementById("noticeMessage").textContent=
"❌ Notice লিখুন।";

return;

}

try{

await db.ref("notices").push(text);

document.getElementById("noticeText").value="";

document.getElementById("noticeMessage").textContent=
"✅ Notice সফলভাবে যোগ হয়েছে!";

loadNotices();

}catch(error){

document.getElementById("noticeMessage").textContent=
"❌ Error: "+error.message;

}

};


/* LOAD NOTICES */

function loadNotices(){

const list=document.getElementById("noticeList");

list.innerHTML="Loading...";

db.ref("notices").once("value").then(snapshot=>{

list.innerHTML="";

if(!snapshot.exists()){

list.innerHTML="<p>কোনো Notice নেই।</p>";

return;

}

snapshot.forEach(item=>{

const div=document.createElement("div");

div.className="result";

div.innerHTML=
"<b>📢 Notice:</b> "+
escapeHTML(item.val())+
"<br><br>"+
"<button onclick=\"deleteNotice('"+item.key+"')\">🗑️ Delete</button>";

list.appendChild(div);

});

}).catch(error=>{

list.innerHTML="❌ "+error.message;

});

}


/* DELETE NOTICE */

window.deleteNotice=async function(key){

if(!confirm("এই Notice মুছে ফেলবেন?")) return;

try{

await db.ref("notices/"+key).remove();

loadNotices();

}catch(error){

alert("❌ "+error.message);

}

};


/* ADD RESULT */

document.getElementById("addResultBtn").onclick=async function(){

const roll=document.getElementById("resultRoll").value.trim();
const name=document.getElementById("resultName").value.trim();
const studentId=document.getElementById("resultStudentId").value.trim();
const semester=document.getElementById("resultSemester").value.trim();
const gpa=document.getElementById("resultGpa").value.trim();

const msg=document.getElementById("resultMessage");

if(!roll || !name || !studentId || !semester || !gpa){

msg.textContent="❌ সব তথ্য পূরণ করুন।";
return;

}

try{

await db.ref("results/"+roll).set({

name:name,
roll:roll,
studentId:studentId,
semester:semester,
gpa:gpa,
status:"Passed"

});

msg.textContent="✅ Result সফলভাবে সংরক্ষণ হয়েছে!";

document.getElementById("resultRoll").value="";
document.getElementById("resultName").value="";
document.getElementById("resultStudentId").value="";
document.getElementById("resultSemester").value="";
document.getElementById("resultGpa").value="";

loadResults();

}catch(error){

msg.textContent="❌ Error: "+error.message;

}

};


/* LOAD RESULTS */

function loadResults(){

const list=document.getElementById("resultList");

list.innerHTML="Loading...";

db.ref("results").once("value").then(snapshot=>{

list.innerHTML="";

if(!snapshot.exists()){

list.innerHTML="<p>কোনো Result নেই।</p>";

return;

}

snapshot.forEach(item=>{

const r=item.val();

const div=document.createElement("div");

div.className="result";

div.innerHTML=
"<b>Roll:</b> "+escapeHTML(r.roll)+
"<br><b>Name:</b> "+escapeHTML(r.name)+
"<br><b>Student ID:</b> "+escapeHTML(r.studentId)+
"<br><b>Semester:</b> "+escapeHTML(r.semester)+
"<br><b>GPA:</b> "+escapeHTML(r.gpa)+
"<br><b>Status:</b> "+escapeHTML(r.status)+
"<br><br>"+
"<button onclick=\"deleteResult('"+item.key+"')\">🗑️ Delete</button>";

list.appendChild(div);

});

}).catch(error=>{

list.innerHTML="❌ "+error.message;

});

}


/* DELETE RESULT */

window.deleteResult=async function(key){

if(!confirm("এই Result মুছে ফেলবেন?")) return;

try{

await db.ref("results/"+key).remove();

loadResults();

}catch(error){

alert("❌ "+error.message);

}

};


/* ESCAPE HTML */

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* LOGOUT */

document.getElementById("logoutBtn").onclick=function(){

auth.signOut();

};

</script>

</body>
</html>
